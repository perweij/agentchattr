[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "agentchattr"
version = "0.5.0"
description = "A local Linux chat forum for humans and coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "mcp>=1.0,<2.0",
    "starlette>=0.36",
    "python-multipart>=0.0.9",
    "packaging>=24",
    "websockets>=15,<18",
]

[project.scripts]
agentchattr = "agentchattr.cli:main"

[dependency-groups]
dev = ["ruff>=0.11", "httpx>=0.27"]
browser = ["playwright>=1.50"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentchattr"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/.github", "/pyproject.toml", "/uv.lock", "/README.md", "/LICENSE", "/config.toml", "/config.local.toml.example"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
